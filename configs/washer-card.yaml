# This card is fully self-contained via HACS (it serves its own images/CSS
# alongside the JS - no manual copying to /config/www/ needed). Just install
# via HACS and use the custom card directly:
#
# NOTE: entity names may differ on your system - check yours under
# Settings -> Devices & Services -> your LG integration.

type: custom:lg-washer-card
entity: sensor.washer
run_state_entity: sensor.washer_run_state
# door_lock_entity is optional - omit it and the card reads the `door_lock`
# attribute off `entity` automatically (this is what ha-smartthinq-sensors
# exposes). Only set this if your integration gives door lock its own entity:
# door_lock_entity: binary_sensor.washer_door_lock
